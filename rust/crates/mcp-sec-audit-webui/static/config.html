<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark";</script>
<title>mcp-sec-audit · 配置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Google+Sans+Text:400,500,700,400i,500i,700i|Google+Sans:400,500|Google+Sans+Display:400,500|Google+Sans+Mono:400,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="config">

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">mcp-sec-audit</span>
    <span class="brand-version">v6.0</span>
  </a>
  <nav class="mainnav" aria-label="主导航">
    <a href="/" data-page="monitor">日志</a>
    <a href="/config" data-page="config">配置</a>
    <a href="/repos" data-page="repos">仓库</a>
    <a href="/about" data-page="about">关于</a>
  </nav>
  <div class="topbar-status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-label">配置</span>
  </div>
  <button class="theme-toggle" id="theme-toggle" aria-label="切换日夜模式" title="切换日夜模式">
    <svg class="ico ico-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></g></svg>
    <svg class="ico ico-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.2A5.5 5.5 0 1 1 6.8 2.5a4.5 4.5 0 0 0 6.7 6.7z" fill="currentColor"/></svg>
  </button>
</header>

<main class="page">
  <div class="page-inner">

    <div class="pagehead">
      <div>
        <div class="pagehead-kicker">运行前配置</div>
        <h1>配置管理</h1>
        <p class="pagehead-sub">以结构化表单或原始 TOML 编辑运行配置，覆盖扫描、四条分析线、融合、报告与批量调度。</p>
      </div>
    </div>

    <div class="config-toolbar">
      <div class="seg" id="config-view" role="tablist" aria-label="配置视图">
        <button role="tab" data-view="form" aria-selected="true">结构化表单</button>
        <button role="tab" data-view="toml" aria-selected="false">原始 TOML</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="btn-import">导入 TOML</button>
      <button class="btn btn-ghost btn-sm" id="btn-export">导出 TOML</button>
      <button class="btn btn-ghost btn-sm" id="btn-reset">恢复默认</button>
      <button class="btn btn-secondary" id="btn-save">保存配置</button>
      <button class="btn btn-primary" id="btn-start">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5-9-5.5z" fill="currentColor"/></svg>
        启动运行
      </button>
    </div>

    <div id="view-form">
      <form id="config-form" novalidate></form>
    </div>

    <div id="view-toml" hidden>
      <p class="config-section-desc" style="margin:0 0 12px">直接编辑 TOML，点击「导入 TOML」回填表单。批量仓库列表写作 <code class="mono" style="background:var(--code-bg);padding:1px 7px;border-radius:6px">[[batch.repo]]</code>。</p>
      <textarea class="textarea textarea--toml" id="toml-editor" spellcheck="false"></textarea>
    </div>

  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
