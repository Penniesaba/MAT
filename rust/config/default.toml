[scan]
targets = ["."]
exclude = ["node_modules", "target", ".venv", "dist"]
languages = ["python", "javascript", "typescript", "rust"]

[static]
enabled = true
save_facts = true

[static.rule]
enabled = true
rule_paths = ["rules/mcp", "rules/languages"]
mode = "strict"

[static.taint]
enabled = false
forward = true
backward = true
max_depth = 8
entrypoint_required = true

[static.agent]
enabled = false
provider = "claude"
# prompt_template_path = "/path/to/custom-prompt.md"  # optional
max_turns = 30
timeout_seconds = 600
extra_args = []

[static.codeql]
enabled = false
# query_pack_path = "/path/to/custom/queries"  # optional
timeout_seconds = 1200
extra_args = []

[dynamic]
enabled = false
sandbox = "existing_python_runtime"
timeout_seconds = 120

[fusion]
enabled = true
strategy = "weighted_evidence"
require_confirmed_by = 1
boost_when_multiple_lines_agree = true
agent_only_as_advisory = true

[report]
formats = ["json", "markdown"]
include_fused_results = true
include_raw_rule_results = false
include_raw_taint_results = false
include_raw_agent_results = false
include_facts = false
