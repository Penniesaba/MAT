[workspace]
members = [
    "crates/mcp-sec-audit-cli",
    "crates/mcp-sec-audit-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/retX0/mcp-sec-audit"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
mcp-sec-audit-core = { path = "crates/mcp-sec-audit-core" }
regex = "1"
rustpython-parser = "0.4"
# Pinned to =1.0.224 because swc_common 0.37.5 re-exports serde::__private as
# `pub use serde::__private as serde;`, and serde >= 1.0.225 made __private actually
# private (E0432).  This pin is required as long as we use swc_core 0.101.
serde = { version = "=1.0.224", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
swc_core = { version = "0.101", features = [
    "ecma_parser",
    "ecma_ast",
    "ecma_visit",
    "common",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
