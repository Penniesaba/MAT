[workspace]
members = [
    "crates/mcp-sec-audit-cli",
    "crates/mcp-sec-audit-core",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/retX0/mcp-sec-audit"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
mcp-sec-audit-core = { path = "crates/mcp-sec-audit-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
