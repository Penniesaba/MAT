# All Languages — Comprehensive Test Configuration
# Scans all three test targets simultaneously
# Usage: cargo run -- scan static -c test-targets/configs/all-languages-config.toml -o /tmp/all-report

[scan]
targets = [
    "../test-targets/python-mcp-server",
    "../test-targets/js-mcp-server",
    "../test-targets/rust-mcp-server",
]
languages = ["python", "javascript", "typescript", "rust"]
exclude = ["__pycache__", ".venv", "node_modules", "target"]

[static]
enabled = true
save_facts = true

[static.rule]
enabled = true
rule_paths = ["rules/mcp", "rules/languages"]
mode = "strict"

[static.taint]
enabled = true
forward = true
backward = true
max_depth = 8
entrypoint_required = false

[static.agent]
enabled = false

[static.codeql]
enabled = false

[fusion]
enabled = true
require_confirmed_by = 1
boost_when_multiple_lines_agree = true
agent_only_as_advisory = true
line_proximity = 5
rule_weight = 3
taint_weight = 2
agent_weight = 1
codeql_weight = 4

[report]
formats = ["json", "markdown"]
include_fused_results = true
include_raw_rule_results = true
include_raw_taint_results = true
include_raw_agent_results = false
include_raw_codeql_results = false
include_facts = true
