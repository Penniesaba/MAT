# Python MCP Server — Static Analysis Test Configuration
# Usage: cargo run -- scan static --config test-targets/configs/python-config.toml

[scan]
targets = ["../test-targets/python-mcp-server"]
languages = ["python"]
exclude = ["__pycache__", ".venv", ".mypy_cache"]

[static]
enabled = true
save_facts = true

[static.rule]
enabled = false
rule_paths = ["rules/mcp", "rules/languages"]

[static.taint]
enabled = false
forward = true
backward = true
max_depth = 8
entrypoint_required = true

[static.agent]
enabled = false
# provider = "claude"
# timeout_seconds = 600

[static.codeql]
enabled = true
binary = "/home/xiao/App/codeql/codeql/codeql"
# timeout_seconds = 1200

[fusion]
enabled = false
require_confirmed_by = 1
boost_when_multiple_lines_agree = true
agent_only_as_advisory = true
line_proximity = 5
rule_weight = 3
taint_weight = 2
agent_weight = 1
codeql_weight = 4

[report]
output = "/home/xiao/Project/mcp-sec-audit/rust/docs/result/<timestamp>"
formats = ["markdown"]
include_fused_results = false
include_raw_rule_results = true
include_raw_taint_results = true
include_raw_agent_results = true
include_raw_codeql_results = true
include_facts = false
