# MCP Vulnerability Benchmark manifest (20 repos: 10 python / 4 typescript / 2 javascript / 4 rust; 22 vuln keys).
# `commit` must be pinned to the VULNERABLE commit (not HEAD). Run fetch.sh to clone.

[scan]
exclude = ["__pycache__", ".venv", "node_modules", "target", ".git"]

[static]
enabled = true
save_facts = true

[static.rule]
enabled = true
rule_paths = ["rules/languages"]

[static.taint]
enabled = true
forward = true
backward = true
max_depth = 8
entrypoint_required = false

[static.agent]
enabled = false

[static.codeql]
enabled = false

[fusion]
enabled = true
require_confirmed_by = 1
boost_when_multiple_lines_agree = true
agent_only_as_advisory = true
line_proximity = 5
rule_weight = 3
taint_weight = 2
agent_weight = 1
codeql_weight = 4

